# Gaussian-splat decoder sized for the full drug + MCP corpus (~286k samples),
# as opposed to configs/decoder/gaussian_splat.yaml which is the small head used
# for the single-target and ten-target overfit studies.
#
# The parameter head is a 1x1x1 stack over the 16^3 latent grid, so width and
# depth are almost free next to the renderer: the renderer evaluates
# 343 neighbours x 8 channels x K gaussians per query point and dominates the
# step. Capacity is therefore bought in the head, not in K.
type: gaussian_splat
compile: false

code_dim: 128

# Parameter head. kernel_size 3 on the first layer gives each latent voxel a
# 3-voxel (~6 A) receptive field instead of seeing only itself; the remaining
# layers stay 1x1x1. norm_groups enables GroupNorm, which the 2-layer head did
# not need but a 4-layer stack does.
hidden_dim: 1024
n_layers: 4
kernel_size: 3
norm_groups: 32

# 2 gaussians per latent voxel per channel. The latent grid already offers 4096
# voxels per channel against ligands of 24 (drug) to 96 (MCP) atoms, so K is not
# the scarce resource -- and renderer cost and memory both scale linearly in K.
gaussians_per_voxel: 2

scale_min: 0.25
scale_max: 1.25
offset_bound: 0.5
initial_opacity: 0.01
opacity_threshold: 0.001

# cutoff_sigma 3.2 with scale_max 1.25 yields local_radius 3 -> 343 neighbours.
# Dropping to cutoff 2.5 / scale_max 1.0 yields radius 2 -> 125 neighbours and a
# 2.7x cheaper step, at the cost of truncating the widest blobs.
cutoff_sigma: 3.2
query_chunk_size: 4096
gaussian_chunk_size: 512
