defaults:
  - sampling: sampling_small
  - sampler: diffusion_sampling
  - override hydra/job_logging: custom
  - _self_

seed: 1269
wandb: false
n_devs: 1
gpu_type: b200
debug: false

exp_name: holo_density_fusion_5mgl_target69
output_dir: exps/density_fusion/holo_5mgl_target69_20260728
dirname: ${output_dir}
save_dir: ${output_dir}/generated

fb_pretrained_path: exps/funcbind/fb_unified
nf_pretrained_path: exps/neural_field/nf_unified
data_dir: funcbind/dataset/data

dset:
  input_dataset: omni_v1
  use_single_dataset: xdocked

denoiser:
  cfg_dropout: 0.0

sampling:
  split: test
  n_chains: 8
  n_targets: 1
  n_samples_per_receptor: 8
  receptor_ids: [69]
  rotate_receptor: false
  chain_init: denovo
  use_metrics: false
  posecheck: false
  docking_mode: null
  batch_size_render: 8192
  batch_size_render_codes: 1
  save_voxel: false
  flexible: true

# A shorter, paired-seed proof-of-concept sampler. This is not the paper's
# dataset-scale N=128/256 evaluation and the report labels it accordingly.
sampler:
  sigma_min: 0.01
  sigma_max: 10.0
  N: 64
  S_churn: 30
  S_min: 5.0
  S_max: 7.0
  S_noise: 1.003
  beta: 2.0
  verbose: false
  modality_cond: true

density:
  target_index: 69
  pdb_id: 5mgl
  ligand_id: 7mu
  crop_path: /home1/irteam/VoxBind/voxbind/dataset/data/xray_crops_aligned_v5/test/000069.npy
  encoder_checkpoint: /home1/irteam/VoxBind/voxbind/exps/260701_plinder_v2p1_box_atomblob7_cdg_channelvit_full_pretrain/checkpoint_e0099.pth.tar
  voxbind_python_root: /home1/irteam/VoxBind
  overfit_steps: 300
  learning_rate: 0.001
  weight_decay: 0.0001
  residual_regularization: 0.0001
  gradient_clip_norm: 1.0
  report_every: 10
  full_render_chunk_size: 8192
  occupancy_point_threshold: 0.1
  density_point_threshold: 1.5
  atom_match_distance: 1.0

  # Reuse an adapter trained in an earlier run instead of only fitting a new
  # one. The loaded adapter is fed this run's density feature, so it isolates
  # the effect of the density input from the effect of the adapter fit.
  transfer_adapter_path: null

  # Emulate an apo map by erasing the ligand from the holo map.
  apo_mask:
    enabled: false
    # Scales the ligand atom radii used by FuncBind's occupancy field. 1.0 is
    # the field the decoder itself predicts; >1 dilates it so no ligand
    # density survives at the envelope fringe.
    radius_scale: 1.25
    # Occupancies at or above this become a hard 1.0, so the ligand core is
    # fully replaced rather than blended.
    mask_floor: 0.5
    # A voxel counts as bulk solvent when it is at least this far (Å) from
    # every ligand and every receptor atom.
    solvent_min_distance: 4.0
    min_solvent_voxels: 1000
    # Leakage diagnostics: how much density above `leakage_sigma` survives
    # within `envelope_radius` Å of a ligand atom.
    envelope_radius: 2.0
    leakage_sigma: 1.5

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false

