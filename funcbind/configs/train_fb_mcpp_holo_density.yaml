defaults:
  - dset: omni
  - denoiser: unet_edm2_XXXL_density
  - sampling: sampling_xsmall
  - sampler: diffusion
  - override hydra/job_logging: custom
  - _self_

debug: false
wandb: true
wandb_tags:
  - funcbind
  - mcpp
  - fusion
  - champion
  - receptor_ed
  - full_holo_ed
  - zero_init
  - non_oracle
  - prefetch4
  - exact_step_logging
  - val_every_epoch
  - checkpoint_every_epoch
  - grad_accum27
  - effective_batch756
seed: 1234
nf_pretrained_path: ${oc.env:FUNCBIND_ROOT,/home1/irteam/funcbind}/exps/neural_field/nf_unified

# Start exactly from the density-free MCP-capable FuncBind weights. The density
# projection is absent from that checkpoint and remains its exact zero initialization.
fb_pretrained_path: ${oc.env:FUNCBIND_ROOT,/home1/irteam/funcbind}/exps/funcbind/fb_unified
resume_optimizer: false

exp_dir: ${oc.env:FUNCBIND_EXP_DIR,exps/funcbind}
exp_name: "fb_mcpp_holo_density_${now:%Y%m%d}_${now:%H%M%S}_${now:%f}"
dirname: "${exp_dir}/${exp_name}"
receptor_dropout: false
n_samples: null

num_epochs: 100000
dset:
  data_dir: ${oc.env:FUNCBIND_ROOT,/home1/irteam/funcbind}/funcbind/dataset/data
  input_dataset: omni_v1
  use_single_dataset: mcpp
  data_aug: true
  rebalance: false
  mcpp_holo_density_dir: ${oc.env:FUNCBIND_ROOT,/home1/irteam/funcbind}/funcbind/dataset/data/mcpp_holo_xray_v1
  voxbind_python_root: ${oc.env:VOXBIND_PYTHON_ROOT,/home1/irteam/VoxBind}
  batch_size: 8
  val_batch_size: 8
  num_workers: 8
  # Workers are rebuilt every epoch on purpose. Each MCP holo-density sample
  # materializes a 144^3 float32 box to crop 64^3 out of it, and the allocator
  # never returns that churn to the OS: worker anon memory grew a measured
  # 39 GiB/h (~126 GiB/epoch) and pinned the 768 GiB cgroup at its cap, at which
  # point a single optimizer step took 38-91 min and the watchdog killed the run.
  # Tearing the workers down at each epoch boundary resets that growth; the
  # respawn costs seconds against a ~12000 s epoch.
  persistent_workers: false
  prefetch_factor: 4
  # NOTE: `in_order: false` used to sit here and never did anything. The loaders are
  # built from config_nf, and update_config_nf (utils_nf.py) forwards a whitelist of
  # dset keys that does not include in_order -- so the loader always read the default
  # True. Measured before removing it: per-sample cost is nearly flat (median 28 ms,
  # max 43 ms, 1.5x) and the loader runs ~70x faster than the GPUs consume, so
  # out-of-order consumption had nothing to win here anyway. Re-adding the key alone
  # will NOT work: it also has to be added to that whitelist.
  beta2: 0.95

denoiser:
  dropout: 0.0
  cfg_dropout: 0.1

sample_every: 10
val_every: 1
checkpoint_every: 1

# Full FuncBind fine-tuning from the baseline checkpoint; the encoder trunk stays frozen.
lr: 0.001
wd: 0.0001
use_lr_schedule: true
ref_batches: 20040
ema_decay: 0.9999
ema_stds: [0.05]
accum_steps: 27
log_every_steps: 1
gpu_type: b200

performance:
  ddp_gradient_as_bucket_view: true
  # Must stay false. Tried 2026-08-24: static_graph installs the reducer's autograd
  # hooks once and asserts they fire on every backward, but this loop accumulates
  # gradients through fabric.no_backward_sync, which skips them on 37 of every 38
  # micro-batches. The first accumulation step dies with
  #   expect_autograd_hooks_ INTERNAL ASSERT FAILED (c10d/reducer.cpp:1634).
  ddp_static_graph: false
  find_unused_parameters: false
  gpu_prefetch: true
  fixed_voxel_box: true
  ema_foreach: true
  optimizer_foreach: true
  # Tried 2026-08-24 and reverted: torch.compile(backend="cudagraphs") still routes
  # through inductor, which dies with "Failed to find C compiler" -- this box has
  # no cc/gcc/g++/clang anywhere, which is the same reason TORCHDYNAMO_DISABLE=1
  # was set in the first place. Dynamo also traced into _prepare_train_batch, not
  # just the model. Leave empty unless a toolchain is installed.
  compile_backend: inductor

hydra:
  run:
    dir: ./${dirname}
  job:
    config:
      override_dirname:
        kv_sep: ""
        item_sep: "_"
        exclude_keys: ["exp_dir"]
