defaults:
  - train_fb_mcpp_holo_density_default
  - _self_

# Preserve BF16 mixed precision: model, gradients, Adam moments, and EMA stay
# FP32. ZeRO-1 shares Adam state; rank-zero CPU EMA avoids another GPU model.
# Static trainable state is ~43.1 GiB/rank on 8 GPUs, before runtime overhead.
# Full-model H100 peak usage must still be measured; small smoke != capacity proof.
precision: bf16-mixed
# Existing conservative rendering-batch preset, not a GPU hardware selector.
gpu_type: a100
save_checkpoints: true
checkpoint_reserve_gib: 30

dset:
  batch_size: 1
  val_batch_size: 1
  num_workers: 6

# 1 sample x 8 GPUs x 95 micro-batches = the reference effective batch 760.
accum_steps: 95

performance:
  # Eager execution avoids extra compilation memory; it does not remove the
  # static-state limit documented above.
  compile_backend: ""
  # The foreach AdamW implementation materializes full-size sqrt/denominator
  # lists at optimizer.step(); process one parameter at a time on 80 GB cards.
  optimizer_foreach: false
  optimizer_sharding: zero1
  ema_cpu: true
  activation_checkpointing: true
  # Avoid holding the next GPU batch while the current backward is at its peak.
  gpu_prefetch: false
