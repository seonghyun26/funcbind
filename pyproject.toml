[project]
name = "funcbind"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "biopandas>=0.5.1",
    "biotite>=1.1.0",
    "hydra-core>=1.3.2",
    "lightning>=2.5.0.post0",
    "numpy<2",
    "openbabel-wheel>=3.1.1.21",
    "pandas",
    "pyuul>=0.4.2",
    "rdkit>=2024.9.6",
    "scipy>=1.15.2",
    "torch>=2.8.0",
    "torchmetrics>=1.6.3",
    "tqdm>=4.67.1",
    "wandb>=0.19.8",
    "pyrosetta",
    "cpdb-protein>=0.2.0",
    "posecheck",
    "easydict>=1.13",
    "meeko==0.1.dev3",
    "vina>=1.2.7",
    "autodocktools-py3",
    "plotly>=6.0.0",
    "einops>=0.8.1",
    "kaleido",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.uv.sources]
pyrosetta = [{url = "https://graylab.jhu.edu/download/PyRosetta4/archive/release/PyRosetta4.Release.python312.linux.wheel/pyrosetta-2024.39+release.59628fb-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and python_version == '3.12'"},
{url = "https://graylab.jhu.edu/download/PyRosetta4/archive/release/PyRosetta4.Release.python311.linux.wheel/pyrosetta-2024.39+release.59628fb-cp311-cp311-linux_x86_64.whl", marker = "sys_platform == 'linux' and python_version == '3.11'"}]
posecheck = { git = "https://github.com/cch1999/posecheck.git" }
autodocktools-py3 = { git = "https://github.com/Valdes-Tresanco-MS/AutoDockTools_py3.git" }

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ipython>=9.0.2",
]
[project.scripts]
sample_fb = "funcbind.sample_fb:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"
fallback_version = "0.0.0"
local_scheme = "no-local-version" # see https://github.com/pypa/setuptools-scm/issues/455

[tool.uv]
environments = ["sys_platform == 'linux'"]
